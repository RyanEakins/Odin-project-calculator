<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A functional calculator!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class>"Calculator"
        <input type="text" id="display" class="display" disabled>
        <div class="buttons">
            <button class="button clear" onclick="clearDisplay()">C</button>
            <button class="button operator" onclick="appendOp('%')">/</button>
            <button class="button operator" onclick="apendOp('-')">-</button>
            <button class="button operator" onclick="appendOp('*')">*</button>
            <button class="button operator" onclick="appendNum('7')">7</button>
            <button class="button operator" onclick="appendNum('8')">8</button>
            <button class="button operator" onclick="appendNum('9')">9</button>
            <button class="button operator" onclick="appendOp('+')">+</button>
            <button class="button operator" onclick="appendNum('4')">4</button>
            <button class="button operator" onclick="appendNum('5')">5</button>
            <button class="button operator" onclick="appendNum('6')">6</button>
            <button class="button operator" onclick="calculate()">=</button>
            <button class="button operator" onclick="appendNum('1')">1</button>
            <button class="button opeartor" onclick="appendNum('2')">2</button>
            <button class="button operator" onclick="appendNum('3')">3</button>
            <button class="button operator" onclick="appendNum('0')">0</button>
        </div>  
    </div>
    <script src="calculator.js"></script>
</body>
</html>
